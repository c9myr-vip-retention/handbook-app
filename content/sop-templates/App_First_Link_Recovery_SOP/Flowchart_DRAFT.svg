<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 380" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/></marker></defs><rect width="1400" height="380" fill="#FFFFFF"/><text x="15" y="26" font-size="15" font-weight="bold" fill="#185FA5">App-First Link Recovery: flow</text><text x="15" y="46" font-size="10" fill="#8A8983">App first, site second. Fix access, then capture identity. Suspicious site: screenshot only, escalate ATL same shift.</text><rect x="15" y="194" width="120" height="48" rx="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="75" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#04342C">Locked out</text><line x1="135" y1="220" x2="157" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="157" y="198" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="217" y="224" text-anchor="middle" font-size="10.5" fill="#0C447C">Point to app</text><line x1="277" y1="220" x2="299" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="299" y="198" width="120" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="359" y="224" text-anchor="middle" font-size="10.5" fill="#0C447C">Send app link</text><line x1="419" y1="220" x2="441" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="441" y="198" width="130" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="506" y="224" text-anchor="middle" font-size="10.5" fill="#0C447C">Send screenshot</text><line x1="571" y1="220" x2="593" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><polygon points="668,163 748,220 668,277 588,220" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/><text x="668" y="224" text-anchor="middle" font-size="10.5" fill="#412402">Download done?</text><line x1="743" y1="220" x2="765" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="765" y="198" width="130" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="830" y="224" text-anchor="middle" font-size="10.5" fill="#0C447C">Site backup link</text><line x1="895" y1="220" x2="917" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="917" y="198" width="170" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="1002" y="224" text-anchor="middle" font-size="10.5" fill="#0C447C">Trusted-source warning</text><line x1="1087" y1="220" x2="1109" y2="220" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="1109" y="194" width="150" height="48" rx="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/><text x="1184" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#04342C">Capture UID + log</text><line x1="668" y1="277" x2="668" y2="306" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><text x="680" y="298" font-size="10" fill="#5F5E5A">No</text><rect x="593" y="306" width="175" height="44" rx="6" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/><text x="680.5" y="332" text-anchor="middle" font-size="10.5" fill="#7A4B00">Prompt once, wait</text><text x="747" y="212" font-size="10" fill="#5F5E5A">Yes</text></svg>