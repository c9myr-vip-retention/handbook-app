<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1720 410" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1720" height="410" fill="#FFFFFF"/>
  <text x="15" y="26" font-size="15" font-weight="bold" fill="#185FA5">Chat Case Library: case-handling flow</text>

  <!-- spine boxes -->
  <rect x="15" y="226" width="110" height="48" rx="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="70" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#04342C">Chat case opens</text>

  <rect x="150" y="227" width="130" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="215" y="254" text-anchor="middle" font-size="11" fill="#0C447C">Identify category</text>

  <rect x="300" y="227" width="120" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="360" y="254" text-anchor="middle" font-size="11" fill="#0C447C">Get details</text>

  <rect x="440" y="227" width="140" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="510" y="254" text-anchor="middle" font-size="11" fill="#0C447C">Verify identity</text>

  <polygon points="680,195 755,250 680,305 605,250" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="680" y="254" text-anchor="middle" font-size="11" fill="#412402">Verification pass?</text>

  <polygon points="920,195 995,250 920,305 845,250" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="920" y="254" text-anchor="middle" font-size="11" fill="#412402">Resolvable at CS?</text>

  <polygon points="1160,195 1235,250 1160,305 1085,250" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="1160" y="254" text-anchor="middle" font-size="11" fill="#412402">Resolved?</text>

  <rect x="1295" y="227" width="130" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="1360" y="254" text-anchor="middle" font-size="11" fill="#0C447C">Notify and close</text>

  <rect x="1450" y="227" width="140" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="1520" y="254" text-anchor="middle" font-size="11" fill="#0C447C">Tag, Claimed, QA</text>

  <rect x="1610" y="226" width="100" height="48" rx="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="1660" y="254" text-anchor="middle" font-size="11" font-weight="bold" fill="#04342C">Done</text>

  <!-- branch boxes -->
  <rect x="840" y="120" width="160" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="920" y="147" text-anchor="middle" font-size="10.5" fill="#0C447C">Take action / submit ticket</text>

  <rect x="605" y="335" width="150" height="44" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="680" y="362" text-anchor="middle" font-size="10.5" fill="#0C447C">Re-verify member</text>

  <rect x="830" y="335" width="180" height="48" rx="6" fill="#FFE6CC" stroke="#D79B00" stroke-width="1.5"/>
  <text x="920" y="363" text-anchor="middle" font-size="10.5" fill="#663D00">Escalate: WL / Support / IT / PYM</text>

  <rect x="1075" y="335" width="170" height="48" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="1160" y="363" text-anchor="middle" font-size="10.5" fill="#0C447C">Advise follow-up, notify later</text>

  <!-- spine arrows -->
  <line x1="125" y1="250" x2="150" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="280" y1="250" x2="300" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="250" x2="440" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="580" y1="250" x2="605" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="755" y1="250" x2="845" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="778" y="242" text-anchor="middle" font-size="10" fill="#5F5E5A">Yes</text>
  <line x1="1040" y1="250" x2="1085" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1235" y1="250" x2="1295" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1258" y="242" text-anchor="middle" font-size="10" fill="#5F5E5A">Yes</text>
  <line x1="1425" y1="250" x2="1450" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1590" y1="250" x2="1610" y2="250" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- dec1 No -> re-verify, rejoin -->
  <line x1="680" y1="305" x2="680" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="692" y="326" font-size="10" fill="#5F5E5A">No</text>
  <path d="M755,357 L800,357 L800,250" fill="none" stroke="#5F5E5A" stroke-width="1.6"/>

  <!-- dec2 Yes -> act (above), No -> escalate (below), rejoin at 1040 -->
  <line x1="920" y1="195" x2="920" y2="166" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="932" y="184" font-size="10" fill="#5F5E5A">Yes</text>
  <path d="M1000,143 L1040,143 L1040,250" fill="none" stroke="#5F5E5A" stroke-width="1.6"/>
  <line x1="920" y1="305" x2="920" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="932" y="326" font-size="10" fill="#5F5E5A">No</text>
  <path d="M1010,359 L1040,359 L1040,250" fill="none" stroke="#5F5E5A" stroke-width="1.6"/>

  <!-- dec3 No -> follow-up, rejoin at 1265 -->
  <line x1="1160" y1="305" x2="1160" y2="335" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="1172" y="326" font-size="10" fill="#5F5E5A">No</text>
  <path d="M1245,359 L1265,359 L1265,250" fill="none" stroke="#5F5E5A" stroke-width="1.6"/>
</svg>
