<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#fff;font-family:Arial}.wrap{max-width:1500px;margin:0 auto;padding:12px}svg{width:100%;height:auto;display:block}</style></head><body><div class="wrap"><svg viewBox="0 0 1260 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1260" height="330" fill="#FFFFFF"/>
  <text x="15" y="26" font-size="15" font-weight="bold" fill="#185FA5">Incognito Browsing: shift flow</text>

  <rect x="15" y="146" width="110" height="48" rx="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="70" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#04342C">Shift starts</text>
  <line x1="125" y1="170" x2="150" y2="170" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="150" y="147" width="230" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="265" y="165" text-anchor="middle" font-size="11" fill="#0C447C"><tspan x="265" dy="0">Open Chrome in Incognito</tspan><tspan x="265" dy="15">(Ctrl+Shift+N)</tspan></text>
  <line x1="380" y1="170" x2="425" y2="170" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <polygon points="500,120 575,170 500,220 425,170" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="500" y="174" text-anchor="middle" font-size="11" fill="#412402">Incognito available?</text>

  <line x1="575" y1="170" x2="620" y2="170" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="597" y="162" text-anchor="middle" font-size="10" fill="#5F5E5A">Yes</text>

  <line x1="500" y1="220" x2="500" y2="256" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="512" y="242" font-size="10" fill="#5F5E5A">No</text>
  <rect x="375" y="256" width="250" height="52" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="500" y="278" text-anchor="middle" font-size="10.5" fill="#501313"><tspan x="500" dy="0">Report to ATL / TL</tspan><tspan x="500" dy="14">do not use a normal window</tspan></text>

  <rect x="620" y="147" width="250" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="745" y="165" text-anchor="middle" font-size="11" fill="#0C447C"><tspan x="745" dy="0">Work only in Incognito</tspan><tspan x="745" dy="15">BO, documents, sites</tspan></text>
  <line x1="870" y1="170" x2="900" y2="170" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="900" y="147" width="210" height="46" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="1005" y="174" text-anchor="middle" font-size="11" fill="#0C447C">Close at breaks and shift end</text>
  <line x1="1110" y1="170" x2="1140" y2="170" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="1140" y="146" width="100" height="48" rx="24" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
  <text x="1190" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#04342C">Done</text>
</svg>
</div></body></html>
