<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sign in · C9MYR VIP Retention Handbook</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/login/c9myr-mark.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script>try { if (localStorage.getItem("hb-theme") === "dark") document.documentElement.dataset.theme = "dark" } catch (e) {}</script>
<style>
  /* Public sign-in page. Only /api and /flowcharts sit behind Access; the button
     goes through /api/login so Access runs the Google sign-in. Same tokens as the app. */
  :root {
    --bg:#F6F7F9; --surface:#FFFFFF; --border:#E3E6EB; --text:#111827; --muted:#4B5563; --faint:#636B77;
    --accent:#2F4FD1; --accent-hover:#2641B0; --on-accent:#FFFFFF; --gold:#D4AF37; --gold-tx:#7F6208;
    --shadow:0 12px 32px rgba(17,24,39,.08); color-scheme:light;
  }
  /* Light like the app; dark only for someone who chose dark in the app (same hb-theme key). */
  :root[data-theme="dark"] {
    --bg:#0F1115; --surface:#161A21; --border:#2A303B; --text:#E6E8EC; --muted:#AEB5C1; --faint:#8F98A6;
    --accent:#8BA4FF; --accent-hover:#A5B8FF; --on-accent:#0F1115; --gold-tx:#E3C35A;
    --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased;
    background:radial-gradient(90% 70% at 50% 0%, color-mix(in srgb, var(--gold) 10%, transparent) 0%, transparent 60%), var(--bg); }
  main { min-height:100%; display:grid; place-items:center; padding:24px 16px; }
  .card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:40px 36px 28px; text-align:center; }
  .mark { width:48px; height:48px; margin:0 auto 14px; display:block; }
  .word { margin:0; font-size:26px; font-weight:800; letter-spacing:.12em; }
  .slogan { margin:6px 0 0; font-size:13.5px; font-weight:600; color:var(--gold-tx); }
  .signedout { margin:-14px 0 18px; font-size:13.5px; color:var(--muted); }
  .eyebrow { margin:14px 0 28px; font-size:15px; font-weight:600; color:var(--muted); }
  h1 { margin:26px 0 6px; font-size:20px; font-weight:700; letter-spacing:-.01em; }
  .lead { margin:0 0 24px; font-size:14.5px; line-height:1.55; color:var(--muted); }
  .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:13px 16px; border-radius:10px; background:var(--accent); color:var(--on-accent);
    font-size:15px; font-weight:600; text-decoration:none; transition:background .12s; }
  .btn:hover { background:var(--accent-hover); }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  .btn svg { width:18px; height:18px; flex:none; background:#fff; border-radius:50%; padding:2px; }
  .note { margin:16px 0 0; font-size:13.5px; color:var(--muted); }
  footer { margin-top:26px; padding-top:16px; border-top:1px solid var(--border); font-size:12px; line-height:1.5; color:var(--faint); }
  @media (max-width:420px) { .card { padding:32px 22px 22px; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<main>
  <section class="card" aria-labelledby="title">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path fill="#D4AF37" d="M50 6C39 23 12 37 12 58c0 13 11 22 23 20 6-1 10-4 13-8-1 10-5 18-12 24h28c-7-6-11-14-12-24 3 4 7 7 13 8 12 2 23-7 23-20 0-21-27-35-38-52z"/></svg>
    <p class="word">C9MYR</p>
    <p class="slogan">Winning Together! Growing Forever!</p>
    <h1 id="title" class="eyebrow">VIP Retention Handbook</h1>
    <p class="signedout" id="out" role="status" hidden>You've signed out.</p>

    <a class="btn" id="signin" href="/api/login">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.2l7.9 6.2C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C1 16.6 0 20.2 0 24s1 7.4 2.7 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </a>

    <footer>Authorised personnel only. Access via your superior.</footer>
  </section>
</main>
<script>
  // Keep the page someone asked for (a #/ route) through the sign-in.
  var q = new URLSearchParams(location.search)
  if (q.get('out')) document.getElementById('out').hidden = false
  var next = q.get('next') || ''
  if (!/^#\/[\w\-\/%.]*$/.test(next)) next = ''
  var go = '/api/login' + (next ? '?next=' + encodeURIComponent(next) : '')
  document.getElementById('signin').href = go
  // Already signed in? Skip this page (not right after signing out).
  if (!q.get('out')) fetch('/api/me', { redirect: 'manual', credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null })
    .then(function (m) { if (m && m.email) location.replace('/' + next) })
    .catch(function () {})
</script>
</body>
</html>
