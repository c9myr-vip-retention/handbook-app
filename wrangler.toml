name = "c9myr-rtn-handbook"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"

# D1 database binding. Create the database, then paste its id here:
#   wrangler d1 create handbook
[[d1_databases]]
binding = "DB"
database_name = "handbook"
database_id = "4e523ae5-28aa-4709-8082-ad6ed1507716"

# Cloudflare Access: the API verifies the Access JWT against these.
# Not secrets (the AUD tag identifies the Access app; the team domain is public).
[vars]
ACCESS_TEAM_DOMAIN = "c9myr-rtn.cloudflareaccess.com"
ACCESS_AUD = "e19e1b564725f7b9a9ec4f4c26a01b6f20fbd1d9f081e5f605259256b3e1554a"

# Learn section: "yes" opens published modules to staff. Anything else = admins only.
LEARN_FOR_STAFF = "no"
